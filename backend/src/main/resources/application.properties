spring.application.name=backend
spring.datasource.url=${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5432/purchase_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:purchase_tracker_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:purchase_tracker_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
 
jwt.secret=${JWT_SECRET}
# 1 hour expiry
jwt.expiration-ms=${JET_EXPIRATION_MS:3600000}

app.cors.allowed-origin = ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
